spring.application.name=QuizAI
server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/quizai
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.ai.model.embedding.text=none
spring.ai.retry.max-attempts=1
server.error.include-message=never
server.error.include-stacktrace=never
spring.ai.openai.api-key=${OPENROUTER_API_KEY:CHAVE_NAO_CONFIGURADA}
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openrouter/free}
spring.ai.openai.chat.options.max-tokens=12000
spring.ai.openai.chat.options.response-format.type=JSON_OBJECT
spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
